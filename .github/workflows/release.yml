name: SENTRIX Multi-Platform Production Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: sentrix-v1.0.0-x86_64-unknown-linux-gnu.tar.gz
            asset_name: sentrix
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: sentrix-v1.0.0-aarch64-unknown-linux-gnu.tar.gz
            asset_name: sentrix
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: sentrix-v1.0.0-aarch64-apple-darwin.tar.gz
            asset_name: sentrix
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: sentrix-v1.0.0-x86_64-apple-darwin.tar.gz
            asset_name: sentrix
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: sentrix-v1.0.0-x86_64-pc-windows-msvc.zip
            asset_name: sentrix.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux / macOS Release Archive
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.asset_name }} dist/
          cp LICENSE README.md RELEASE.md dist/
          cd dist
          tar -czvf ../${{ matrix.artifact_name }} .

      - name: Package Windows Release Archive
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\${{ matrix.asset_name }} dist\
          copy LICENSE dist\
          copy README.md dist\
          copy RELEASE.md dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Generate Checksum
        run: sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
        shell: bash

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
